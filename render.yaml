# Render Blueprint: one web service built from the Dockerfile. See docs/DEPLOY.md.
# The connection string is a secret: Render asks for it when the Blueprint is created (sync: false), it is never stored here.
services:
  - type: web
    name: barberbook
    runtime: docker
    plan: free
    region: singapore   # same region as the Neon project (AWS Singapore); a service's region cannot be changed later
    healthCheckPath: /healthz
    envVars:
      - key: ConnectionStrings__Default
        sync: false
      - key: Proxy__TrustForwardedHeaders
        value: "true"
      - key: Trial__Days
        value: "30"
      - key: App__PublicBaseUrl
        value: "https://flow.veskacode.com"   # the address printed in QR codes; leave blank to use the address the page was opened on
      - key: Database__MigrateOnStartup
        value: "true"
